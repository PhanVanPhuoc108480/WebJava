<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Training | Quản lý sinh viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/students.css">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h2>University Training</h2>
            </div>
            <nav class="nav-list">
                <a class="nav-item active" href="#">
                    <i class="fa-solid fa-users"></i> Sinh viên
                </a>
                <a class="nav-item" href="#">
                    <i class="fa-solid fa-book-open"></i> Học phần
                </a>
                <a class="nav-item" href="#">
                    <i class="fa-solid fa-school"></i> Phòng học
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Quản lý sinh viên</h1>
                <div class="breadcrumb">Home / Sinh viên</div>
            </header>

            <section class="card-box">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-users"></i> Danh sách sinh viên
                    </div>
                    <button class="btn btn-primary" id="open-create-top">
                        <i class="fa-solid fa-circle-plus"></i> Thêm sinh viên
                    </button>
                </div>

                <div class="card-body">
                    <div class="search-bar">
                        <div class="input-group">
                            <input type="text" id="search-input" placeholder="Tìm mã SV, họ tên, email..." autocomplete="off">
                            <button class="btn btn-primary btn-search" id="search-btn">
                                <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50px; text-align: center;">STT</th>
                                    <th>Mã sinh viên</th>
                                    <th>Họ và tên</th>
                                    <th>Email</th>
                                    <th>Số điện thoại</th>
                                    <th>Lớp</th>
                                    <th style="width: 150px; text-align: center;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="student-rows">
                                <!-- Dữ liệu sẽ tự động load ở đây -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Thêm/Sửa Sinh Viên -->
    <div class="modal-backdrop" id="student-modal" aria-hidden="true">
        <div class="modal">
            <button class="modal-close" id="close-modal">&times;</button>
            <h2 id="modal-title">Thêm sinh viên</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="student-code">Mã sinh viên:</label>
                        <input id="student-code" required placeholder="VD: 108480">
                    </div>
                    <div class="form-group">
                        <label for="full-name">Họ và tên:</label>
                        <input id="full-name" required placeholder="VD: Phan Văn Phước">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input id="email" type="email" required placeholder="phuoc108480@donga.edu.vn">
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại:</label>
                        <input id="phone" placeholder="0388496329">
                    </div>
                    <div class="form-group wide">
                        <label for="class-name">Lớp:</label>
                        <input id="class-name" placeholder="IT24B">
                    </div>
                </div>

                <p class="form-error" id="form-error"></p>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="/js/students.js"></script>
</body>
</html>
